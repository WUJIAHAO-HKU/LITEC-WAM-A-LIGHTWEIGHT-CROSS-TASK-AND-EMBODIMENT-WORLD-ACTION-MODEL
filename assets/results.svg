<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-labelledby="title desc">
  <title id="title">Reported evidence at a glance</title>
  <desc id="desc">47.57 million stored backbone parameters. 48/50 on five selected LIBERO tasks. 104/120 on fifteen development-set RLBench tasks. 65 physical trials on three bimanual tasks.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1" y="1" width="286" height="192" rx="18" fill="#eaf8f7" stroke="#b7e2dd"/>
    <rect x="305" y="1" width="286" height="192" rx="18" fill="#edf3ff" stroke="#c6d7f7"/>
    <rect x="609" y="1" width="286" height="192" rx="18" fill="#f4efff" stroke="#dacfef"/>
    <rect x="913" y="1" width="286" height="192" rx="18" fill="#fff3e8" stroke="#f0d4b9"/>
    <g font-size="12" font-weight="700" letter-spacing="1.5">
      <text x="25" y="36" fill="#1b7770">SHARED BACKBONE</text><text x="329" y="36" fill="#325eab">LIBERO</text>
      <text x="633" y="36" fill="#7550aa">RLBENCH</text><text x="937" y="36" fill="#9b5628">SO-ARM101</text>
    </g>
    <g font-size="45" font-weight="800" fill="#15263d">
      <text x="24" y="96">47.57M</text><text x="328" y="96">48 / 50</text><text x="632" y="96">104 / 120</text><text x="936" y="96">65 trials</text>
    </g>
    <g font-size="15" fill="#344965">
      <text x="25" y="132">Stored parameters</text><text x="329" y="132">Five selected tasks · 96.0%</text>
      <text x="633" y="132">15 tasks · 86.67%</text><text x="937" y="132">Three physical bimanual tasks</text>
    </g>
    <g font-size="12" fill="#627186">
      <text x="25" y="164">Distinct from active parameter count</text><text x="329" y="164">Not the official four-suite average</text>
      <text x="633" y="164">Evaluation set used in development</text><text x="937" y="164">Separate from trajectory-error analysis</text>
    </g>
  </g>
</svg>
