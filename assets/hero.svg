<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">LiteC-WAM</title>
  <desc id="desc">A lightweight cross-task-and-embodiment world action model. Public evaluation toolkit.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071529"/><stop offset=".6" stop-color="#16224b"/><stop offset="1" stop-color="#302451"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#55e4db"/><stop offset=".5" stop-color="#83a8ff"/><stop offset="1" stop-color="#da99ff"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <circle cx="1035" cy="100" r="200" fill="#7166f0" opacity=".11"/>
  <circle cx="1090" cy="390" r="180" fill="#36d7d1" opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="48" width="266" height="29" rx="14" fill="#173f52" stroke="#31828b"/>
    <text x="71" y="68" font-size="12" letter-spacing="2" font-weight="700" fill="#a0f6e7">PUBLIC EVALUATION TOOLKIT</text>
    <text x="52" y="165" font-size="82" font-weight="800" letter-spacing="-3" fill="url(#accent)">LiteC-WAM</text>
    <text x="57" y="211" font-size="23" font-weight="600" fill="#edf3ff">Small backbone. Action-conditioned futures.</text>
    <text x="57" y="246" font-size="23" font-weight="600" fill="#edf3ff">Multiple task and robot interfaces.</text>
    <text x="58" y="287" font-size="16" fill="#aebcda">A Lightweight Cross-Task-and-Embodiment World Action Model</text>
    <g font-size="13" font-weight="700">
      <rect x="56" y="330" width="153" height="38" rx="19" fill="#133e54"/><text x="77" y="354" fill="#78e8e0">47.57M backbone</text>
      <rect x="220" y="330" width="158" height="38" rx="19" fill="#3a2d60"/><text x="239" y="354" fill="#d2b7ff">Top-2 / 8 experts</text>
      <rect x="389" y="330" width="151" height="38" rx="19" fill="#533b3d"/><text x="409" y="354" fill="#ffc299">8-step actions</text>
    </g>
    <g transform="translate(820 81)">
      <path d="M34 82H208M34 82L120 219M208 82L120 219" fill="none" stroke="#697ead" stroke-width="3"/>
      <circle cx="34" cy="82" r="43" fill="#173d54" stroke="#5ce0d6" stroke-width="2"/>
      <circle cx="208" cy="82" r="43" fill="#3c2c61" stroke="#c8a2ff" stroke-width="2"/>
      <circle cx="120" cy="219" r="43" fill="#50353d" stroke="#ffb582" stroke-width="2"/>
      <g text-anchor="middle" font-weight="700" font-size="13">
        <text x="34" y="87" fill="#a5f5ee">OBSERVE</text>
        <text x="208" y="87" fill="#e3ceff">PREDICT</text>
        <text x="120" y="224" fill="#ffdcc2">ACT</text>
      </g>
      <g fill="#8d9cc5"><circle cx="121" cy="82" r="5"/><circle cx="77" cy="152" r="5"/><circle cx="165" cy="152" r="5"/></g>
    </g>
  </g>
</svg>
