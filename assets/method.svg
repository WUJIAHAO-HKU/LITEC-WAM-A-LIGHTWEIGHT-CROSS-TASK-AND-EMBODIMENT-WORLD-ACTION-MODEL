<g text-anchor="middle" font-size="13" fill="#536580"><text x="167" y="140">RGB + state + instruction</text><text x="600" y="140">Eight-step action chunks</text><text x="600" y="279">Action-conditioned · Top-2 of 8</text><text x="1028" y="140">Robot-specific action conventions</text></g>
<text x="516" y="201" text-anchor="end" font-size="12" fill="#536580">Candidate actions</text><text x="684" y="201" font-size="12" fill="#71549c" font-weight="700">World-model feedback</text>
<text x="32" y="336" font-size="12" fill="#63748a">Feedback placement and freeze boundaries depend on the evaluated configuration; this diagram is not a single execution graph.</text>
