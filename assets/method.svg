<g stroke="#7c8ba3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M302 124H440"/><path d="M760 124H888"/><path d="M530 170V221"/><path d="M670 221V170"/></g>
<rect x="32" y="76" width="270" height="95" rx="14" fill="#e5f7f4" stroke="#9dd7cf"/>
<rect x="440" y="76" width="320" height="95" rx="14" fill="#eaf0ff" stroke="#b5c9f2"/>
